<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Crowne Plaza Hotel</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
  <div class="hero-wrapper">
    <div class="container">
      <div class="login-card-wrapper">
        <div class="card-luxury">
          
          <div class="brand-header">
            <div class="brand-logo-badge">
              <i class="fa-solid fa-crown"></i>
            </div>
            <h2 class="brand-title">Crowne Plaza</h2>
            <p class="brand-subtitle">Sign in to your Account</p>
          </div>

          <div id="login-alert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

          <form id="loginForm" onsubmit="event.preventDefault(); login();">
            
            <div class="form-group">
              <label class="form-label-custom" for="email">Email Address</label>
              <div class="position-relative">
                <input id="email" type="email" class="form-control-luxury" placeholder="name@domain.com" required value="guest@crowneplaza.com">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label-custom" for="password">Password</label>
              <input id="password" type="password" class="form-control-luxury" placeholder="••••••••" required value="password123">
            </div>

            <div class="form-group">
              <label class="form-label-custom">Select Role</label>
              <div class="role-selector-group">
                <div class="role-option">
                  <input type="radio" id="role-customer" name="role" value="customer" checked>
                  <label for="role-customer" class="role-card">
                    <i class="fa-solid fa-user-check"></i>
                    <span>Customer</span>
                  </label>
                </div>

                <div class="role-option">
                  <input type="radio" id="role-receptionist" name="role" value="receptionist">
                  <label for="role-receptionist" class="role-card">
                    <i class="fa-solid fa-concierge-bell"></i>
                    <span>Receptionist</span>
                  </label>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-gold mt-3">
              <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
            </button>
          </form>

          <div class="login-footer-links border-top pt-3 mt-4">
            <a href="index.html" class="link-gold text-secondary small">
              <i class="fa-solid fa-arrow-left me-1"></i> Back to Home
            </a>
            <a href="register.html" class="link-gold small">
              Create an Account
            </a>
          </div>

        </div>

        <div class="footer-text mt-3">
          Crowne Plaza Hotel &copy; 2026
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/login.js"></script>
</body>
</html>
