<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access - Crowne Plaza Hotel</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Luxury Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="hero-wrapper position-relative">
    <!-- Ambient Floating Background Accents -->
    <div class="orb-container">
      <div class="floating-orb orb-gold" style="opacity: 0.12;"></div>
      <div class="floating-orb orb-navy" style="opacity: 0.2;"></div>
    </div>
    <div class="container position-relative" style="max-width: 960px; z-index: 10;">
      <div class="card-luxury-dark py-5 px-4 text-center fade-in-up" style="border-radius: 2rem; border: 2px solid rgba(212, 175, 55, 0.7); box-shadow: 0 28px 60px rgba(0,0,0,0.45);">

        <div class="brand-logo-badge mx-auto mb-3" style="width: 88px; height: 88px; font-size: 2.2rem; box-shadow: 0 0 25px rgba(212, 175, 55, 0.65);">
          <i class="fa-solid fa-crown"></i>
        </div>

        <h1 class="brand-title display-4 mb-2" style="font-size: clamp(3rem, 5vw, 6rem); line-height: 1;">Crowne Plaza Hotel</h1>
        <p class="brand-subtitle fs-5 mb-4 text-warning text-uppercase" style="letter-spacing: 0.12em; font-weight: 700; margin-top: 1rem;">
          Welcome to your home away from home
        </p>

        <div class="row g-3 justify-content-center mb-4 mt-4">
          <div class="col-md-5">
            <a href="reception-login.html" class="btn btn-navy py-3 w-100 fs-5 shadow d-flex align-items-center justify-content-between border border-gold" style="border-radius: 1.25rem; min-height: 88px; font-weight: 600;">
              <span class="d-flex align-items-center gap-3">
                <i class="fa-solid fa-concierge-bell fs-4 text-gold"></i>
                <span>Reception Desk Portal</span>
              </span>
              <i class="fa-solid fa-angle-right fs-4 text-gold"></i>
            </a>
          </div>

          <div class="col-md-5">
            <a href="customer-login.html" class="btn btn-gold py-3 w-100 fs-5 shadow d-flex align-items-center justify-content-between" style="border-radius: 1.25rem; min-height: 88px; font-weight: 700; color: var(--primary-navy);">
              <span class="d-flex align-items-center gap-3">
                <i class="fa-solid fa-key fs-4" style="color: var(--primary-navy);"></i>
                <span>Customer Portal</span>
              </span>
              <i class="fa-solid fa-angle-right fs-4" style="color: var(--primary-navy);"></i>
            </a>
          </div>
        </div>

        <div class="d-flex justify-content-center gap-3 pt-3 border-top border-secondary text-slate-300 small flex-wrap" style="margin-top: 2rem;">
          <span><i class="fa-solid fa-check-circle text-success me-1"></i> Role-Based Access Control</span>
          <span><i class="fa-solid fa-bolt text-warning me-1"></i> Instant Demo Logins</span>
          <span><i class="fa-solid fa-lock text-info me-1"></i> Live Room State Engine</span>
        </div>

      </div>
    </div>
  </div>
  <script>
    // Creative Background Particles & Mouse Parallax
    function initCreativeEffects() {
      const container = document.querySelector('.orb-container');
      if (container) {
        for (let i = 0; i < 25; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          p.style.left = Math.random() * 100 + 'vw';
          p.style.animationDelay = Math.random() * 12 + 's';
          p.style.animationDuration = (8 + Math.random() * 8) + 's';
          p.style.transform = `scale(${0.3 + Math.random() * 0.8})`;
          container.appendChild(p);
        }
      }

      document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.clientX) / 45;
        const y = (window.innerHeight / 2 - e.clientY) / 45;
        const gold = document.querySelector('.orb-gold');
        const navy = document.querySelector('.orb-navy');
        if (gold) gold.style.transform = `translate(${x}px, ${y}px)`;
        if (navy) navy.style.transform = `translate(${-x}px, ${-y}px)`;
      });
    }
    document.addEventListener('DOMContentLoaded', initCreativeEffects);
  </script>
</body>
</html>
