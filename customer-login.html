<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Login - Crowne Plaza Hotel</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Luxury Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="hero-wrapper position-relative">
    <!-- Ambient Floating Background Accents -->
    <div class="orb-container">
      <div class="floating-orb orb-gold"></div>
      <div class="floating-orb orb-navy"></div>
    </div>

    <div class="container position-relative" style="max-width: 520px; z-index: 10;">
      <div class="card-luxury text-center fade-in-up">
        
        <div class="brand-logo-badge mx-auto">
          <i class="fa-solid fa-crown"></i>
        </div>

        <h2 class="brand-title mb-1">Guest Portal</h2>
        <p class="brand-subtitle mb-4">Welcome back to Crowne Plaza</p>

        <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert"></div>

        <form id="customerLoginForm" onsubmit="event.preventDefault(); handleCustomerLogin();">
          
          <div class="form-group text-start mb-3">
            <label class="form-label-custom" for="guestEmail">Email, Phone, or Room ID</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
              <input id="guestEmail" type="text" class="form-control form-control-luxury border-start-0 ps-0" placeholder="Email, Phone, or Room ID (e.g. 101)" required value="guest@crowneplaza.com">
            </div>
          </div>

          <div class="form-group text-start mb-3">
            <label class="form-label-custom" for="guestPassword">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-key"></i></span>
              <input id="guestPassword" type="password" class="form-control form-control-luxury border-start-0 ps-0" placeholder="••••••••" required value="guest123">
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check text-start">
              <input class="form-check-input" type="checkbox" id="rememberGuest" checked>
              <label class="form-check-label text-muted small" for="rememberGuest">Remember me</label>
            </div>
            <a href="#" class="text-gold text-decoration-none small" onclick="alert('Password reset link sent to your email!')">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-gold py-3 w-100 fs-6 mb-3">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Guest Portal
          </button>
        </form>

        <div class="d-flex justify-content-between border-top pt-3 mt-4 text-start">
          <a href="register.html" class="btn btn-sm btn-secondary-luxury py-1 px-3">
            <i class="fa-solid fa-user-plus me-1"></i> Create Guest Account
          </a>
          <a href="reception-login.html" class="text-muted text-decoration-none small align-self-center">
            Staff Portal <i class="fa-solid fa-concierge-bell me-1"></i>
          </a>
        </div>

      </div>

      <div class="footer-text mt-3">
        &copy; 2026 Crowne Plaza Hotel &bull; Premier Guest Experience
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    async function handleCustomerLogin() {
      const emailOrRoom = document.getElementById('guestEmail').value.trim();
      const password = document.getElementById('guestPassword').value.trim();
      const alertBox = document.getElementById('loginAlert');

      alertBox.classList.add('d-none');

      if (!emailOrRoom || !password) {
        alertBox.textContent = 'Please enter your login details.';
        alertBox.classList.remove('d-none');
        return;
      }

      // Check if it is a Room ID (a number)
      const isRoomId = /^\d+$/.test(emailOrRoom);

      if (isRoomId) {
        // Authenticate by Room ID and Wi-Fi password
        let booking = null;
        if (window.HotelDB && typeof window.HotelDB.findActiveBookingByRoomAsync === 'function') {
          booking = await window.HotelDB.findActiveBookingByRoomAsync(emailOrRoom);
        } else if (window.HotelDB && typeof window.HotelDB.findActiveBookingByRoom === 'function') {
          booking = window.HotelDB.findActiveBookingByRoom(emailOrRoom);
        } else if (window.HotelDB && typeof window.HotelDB.getBookingsAsync === 'function') {
          const bookings = await window.HotelDB.getBookingsAsync();
          booking = bookings.find(b => String(b.roomNumber).trim() === String(emailOrRoom).trim() && ['Checked-in', 'Confirmed', 'Booked'].includes(b.status));
        }
        if (!booking) {
          alertBox.textContent = `No active reservation found for Room #${emailOrRoom}.`;
          alertBox.classList.remove('d-none');
          return;
        }

        const expectedPwd = booking.wifiPassword || 'hotelmanagement';
        if (password !== expectedPwd) {
          alertBox.textContent = 'Invalid Wi-Fi password for this Room ID.';
          alertBox.classList.remove('d-none');
          return;
        }

        // Login success!
        loginUser(booking.guestEmail, 'customer', booking.guestName, { 
          phone: booking.guestPhone, 
          roomNumber: booking.roomNumber,
          bookingId: booking.id,
          isRoomIdLogin: true
        });
        window.location.href = 'customer-dashboard.html';
      } else {
        // Try backend DB login first
        try {
          const response = await fetch('http://127.0.0.1:5000/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailOrRoom, password: password })
          });
          const result = await response.json();
          if (response.ok && result.customer) {
            loginUser(result.customer.email, 'customer', result.customer.name, {
              phone: result.customer.phone,
              customerId: result.customer.customer_id
            });
            window.location.href = 'customer-dashboard.html';
            return;
          } else {
            alertBox.textContent = result.error || 'Invalid credentials.';
            alertBox.classList.remove('d-none');
            return;
          }
        } catch(e) {
          alertBox.textContent = 'Cannot connect to backend server. Please ensure Flask server is running.';
          alertBox.classList.remove('d-none');
        }
      }
    }

    // Creative Background Particles & Mouse Parallax
    function initCreativeEffects() {
      const container = document.querySelector('.orb-container');
      if (container) {
        for (let i = 0; i < 25; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          p.style.left = Math.random() * 100 + 'vw';
          p.style.animationDelay = Math.random() * 12 + 's';
          p.style.animationDuration = (8 + Math.random() * 8) + 's';
          p.style.transform = `scale(${0.3 + Math.random() * 0.8})`;
          container.appendChild(p);
        }
      }

      document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.clientX) / 45;
        const y = (window.innerHeight / 2 - e.clientY) / 45;
        const gold = document.querySelector('.orb-gold');
        const navy = document.querySelector('.orb-navy');
        if (gold) gold.style.transform = `translate(${x}px, ${y}px)`;
        if (navy) navy.style.transform = `translate(${-x}px, ${-y}px)`;
      });
    }
    document.addEventListener('DOMContentLoaded', initCreativeEffects);
  </script>
</body>
</html>
