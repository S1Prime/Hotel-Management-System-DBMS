<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost &amp; Found - Crowne Plaza Hotel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background-color:#f8fafc">
  <nav class="dashboard-navbar">
    <a href="index.html" class="dashboard-brand"><i class="fa-solid fa-crown text-warning me-2"></i><span>Crowne Plaza &bull; Lost &amp; Found</span></a>
    <div class="d-flex align-items-center gap-2">
      <span id="lfUserName" class="text-white small me-2"></span>
      <a id="lfBackLink" class="btn btn-sm btn-outline-light rounded-pill px-3" href="customer-dashboard.html">Back to Dashboard</a>
      <button onclick="logoutUser()" class="btn btn-sm btn-outline-light rounded-pill px-3"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
    </div>
  </nav>
  <main class="main-content">
    <div class="mb-4">
      <h1 class="font-serif text-dark">Lost &amp; Found</h1>
      <p class="text-muted mb-0">Browse reported items and follow updates from our guests and front desk team.</p>
    </div>
    <div id="lfAlert" class="alert d-none" role="alert"></div>
    <section id="lfCreatePanel" class="card p-4 border-0 shadow-sm rounded-4 bg-white mb-4 d-none">
      <h2 class="font-serif fs-4 mb-3"><i class="fa-solid fa-circle-plus text-gold me-2"></i>Report a Lost Item</h2>
      <form id="lfCreateForm" class="row g-3">
        <div class="col-md-6"><label class="form-label-custom" for="lfItem">Item name</label><input id="lfItem" class="form-control form-control-luxury" maxlength="120" required></div>
        <div class="col-md-6"><label class="form-label-custom" for="lfLocation">Where was it lost?</label><input id="lfLocation" class="form-control form-control-luxury" maxlength="200" placeholder="Restaurant, room, lobby..." required></div>
        <div class="col-md-6"><label class="form-label-custom" for="lfLostAt">Date and time</label><input id="lfLostAt" type="datetime-local" class="form-control form-control-luxury" required></div>
        <div class="col-md-6"><label class="form-label-custom" for="lfImage">Item photo (JPG, PNG, GIF, WebP; up to 5 MB)</label><input id="lfImage" type="file" accept="image/jpeg,image/png,image/gif,image/webp" class="form-control form-control-luxury"></div>
        <div class="col-12"><label class="form-label-custom" for="lfDescription">Description and identifying details</label><textarea id="lfDescription" class="form-control form-control-luxury" maxlength="5000" rows="3" required></textarea></div>
        <div class="col-12"><button class="btn btn-gold rounded-pill px-4" type="submit"><i class="fa-solid fa-paper-plane me-2"></i>Submit Report</button></div>
      </form>
    </section>
    <div id="lfReports" class="row g-4"></div>
  </main>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/lost-found.js"></script>
</body>
</html>
