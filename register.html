<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Registration - Crowne Plaza Hotel</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Luxury Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <div class="hero-wrapper position-relative">
    <!-- Ambient Floating Background Accents -->
    <div class="orb-container">
      <div class="floating-orb orb-gold"></div>
      <div class="floating-orb orb-navy"></div>
    </div>

    <div class="container position-relative" style="max-width: 540px; z-index: 10;">
      <div class="card-luxury fade-in-up">

        <div class="brand-logo-badge mx-auto">
          <i class="fa-solid fa-user-plus"></i>
        </div>

        <h2 class="brand-title text-center mb-1">Guest Registration</h2>
        <p class="brand-subtitle text-center mb-4">Create your Crowne Plaza Guest Account</p>

        <div id="registerAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert"></div>

        <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label-custom" for="regFirstName">First Name</label>
              <input id="regFirstName" type="text" class="form-control form-control-luxury" placeholder="Rahul"
                required>
            </div>
            <div class="col-sm-6">
              <label class="form-label-custom" for="regLastName">Last Name</label>
              <input id="regLastName" type="text" class="form-control form-control-luxury" placeholder="Kumar" required>
            </div>
          </div>

          <div class="form-group text-start mb-3">
            <label class="form-label-custom" for="regEmail">Email Address</label>
            <input id="regEmail" type="email" class="form-control form-control-luxury"
              placeholder="rahulkumar@example.com" required>
          </div>

          <div class="form-group text-start mb-3">
            <label class="form-label-custom" for="regPhone">Phone Number</label>
            <input id="regPhone" type="tel" class="form-control form-control-luxury" placeholder="+1 (555) 000-0000"
              required>
          </div>

          <div class="form-group text-start mb-4">
            <label class="form-label-custom" for="regPassword">Password</label>
            <input id="regPassword" type="password" class="form-control form-control-luxury"
              placeholder="Minimum 6 characters" minlength="6" required>
          </div>

          <button type="submit" class="btn btn-gold py-3 w-100 fs-6 mb-3">
            <i class="fa-solid fa-check-circle me-2"></i> Register & Access Guest Portal
          </button>
        </form>

        <div class="d-flex justify-content-between border-top pt-3 mt-3 text-start">
          <a href="customer-login.html" class="text-gold text-decoration-none small">
            <i class="fa-solid fa-arrow-left me-1"></i> Already registered? Sign In
          </a>
          <a href="index.html" class="text-muted text-decoration-none small">
            Home <i class="fa-solid fa-house me-1"></i>
          </a>
        </div>

      </div>

      <div class="footer-text mt-3">
        &copy; 2026 Crowne Plaza Hotel &bull; Guest Account Services
      </div>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
  <script>
    async function handleRegister() {
      const firstName = document.getElementById('regFirstName').value.trim();
      const lastName = document.getElementById('regLastName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const alertBox = document.getElementById('registerAlert');

      alertBox.classList.add('d-none');

      if (!firstName || !lastName || !email || !password) {
        alertBox.textContent = 'Please fill out all required fields.';
        alertBox.classList.remove('d-none');
        return;
      }

      const submitBtn = document.querySelector('#registerForm button[type="submit"]');
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Registering...';

      try {
        const response = await fetch('http://127.0.0.1:5000/api/customers', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: `${firstName} ${lastName}`,
            email: email,
            phone: phone,
            password: password
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Registration failed. Please try again.');
        }

        const customer = result.customer;
        loginUser(customer.email, 'customer', customer.name, {
          phone: customer.phone,
          customerId: customer.customer_id
        });

        alert(`Welcome to Crowne Plaza, ${customer.name}! Your account has been saved to PostgreSQL.`);
        window.location.href = 'customer-dashboard.html';

      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalBtnText;
      }
    }
  </script>
</body>

</html>
