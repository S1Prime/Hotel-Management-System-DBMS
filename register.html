<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Registration - Crowne Plaza Hotel</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="hero-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <div class="card-luxury">
            
            <div class="brand-header">
              <div class="brand-logo-badge">
                <i class="fa-solid fa-crown"></i>
              </div>
              <h2 class="brand-title">Crowne Plaza</h2>
              <p class="brand-subtitle">Guest Registration</p>
            </div>

            <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="form-group mb-0">
                    <label class="form-label-custom" for="reg-firstname">First Name</label>
                    <input id="reg-firstname" type="text" class="form-control-luxury" placeholder="Jane" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group mb-0">
                    <label class="form-label-custom" for="reg-lastname">Last Name</label>
                    <input id="reg-lastname" type="text" class="form-control-luxury" placeholder="Doe" required>
                  </div>
                </div>
              </div>

              <div class="form-group mt-3">
                <label class="form-label-custom" for="reg-email">Email Address</label>
                <input id="reg-email" type="email" class="form-control-luxury" placeholder="jane.doe@example.com" required>
              </div>

              <div class="form-group">
                <label class="form-label-custom" for="reg-phone">Phone Number</label>
                <input id="reg-phone" type="tel" class="form-control-luxury" placeholder="+1 (555) 000-1234" required>
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <div class="form-group mb-0">
                    <label class="form-label-custom" for="reg-password">Password</label>
                    <input id="reg-password" type="password" class="form-control-luxury" placeholder="••••••••" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group mb-0">
                    <label class="form-label-custom" for="reg-confirm">Confirm Password</label>
                    <input id="reg-confirm" type="password" class="form-control-luxury" placeholder="••••••••" required>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-gold mt-4">
                <i class="fa-solid fa-check-circle me-2"></i> Register Account
              </button>
            </form>

            <div class="text-center border-top pt-3 mt-4">
              <span class="text-muted small">Already have an account?</span>
              <a href="login.html" class="link-gold ms-1 small">Sign In here</a>
            </div>

          </div>

          <div class="footer-text mt-3">
            Crowne Plaza Hotel &copy; 2026
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleRegister() {
      const email = document.getElementById('reg-email').value;
      const firstName = document.getElementById('reg-firstname').value;
      sessionStorage.setItem('user', JSON.stringify({
        role: 'customer',
        email: email,
        name: firstName || 'Guest'
      }));
      alert('Registration Successful! Redirecting to Customer Dashboard...');
      window.location.href = 'customer/dashboard.html';
    }
  </script>
</body>
</html>
